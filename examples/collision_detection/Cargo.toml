[package]
name = "collision_detection"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# Standalone character-tuning entry point (duplicate of src/main.rs).
# Runs from: cargo run -p collision_detection --bin character_tuning_main
[[bin]]
name = "character_tuning_main"
path = "src/character_tuning_main.rs"

# Raibert lower-body kinematic sandbox.
# Runs from: cargo run -p collision_detection --bin raibert_sandbox
[[bin]]
name = "raibert_sandbox"
path = "src/raibert_sandbox_main.rs"

# Rendered (DefaultPlugins + VelloPlugin) twin of the headless command-driven
# harness. Shares the same harness modules (command/config/math/probe/dispatch/
# assets/collision/report/sample) via sibling `mod` declarations.
# Runs from: cargo run -p collision_detection --example visual_arm_pd --release
[[example]]
name = "visual_arm_pd"
path = "examples/headless_arm_pd/visual.rs"

[dependencies]
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
#particle won't work with multi-threaded
bevy = { workspace = true}
vello_physics = { workspace = true }
# Headless collision: wgpu 24 matches the version used by `bevy_vello`/vello.
wgpu = "24.0"

bevy_behave = { git = "https://github.com/AlienSmith/bevy_behave", branch = "bevy-0.16-fix" }
bevy_vello = { path = "../../"}
bevy_egui = "0.34.0"
game_lib ={ path = "../game_lib" }
leafwing-input-manager = "0.17"
